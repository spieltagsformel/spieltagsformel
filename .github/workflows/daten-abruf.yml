name: Daten abrufen

# Läuft automatisch nach Zeitplan (Zeiten in UTC) und ist weiterhin manuell startbar:
# Actions -> "Daten abrufen" -> "Run workflow"
on:
  schedule:
    - cron: "17 5 * * *"      # täglich 06:17 MEZ: Ergebnisse, Datenpaket, Nachbericht
    - cron: "47 16 * * 5"     # Fr 17:47 MEZ: Quoten kurz vor dem Freitagsspiel
    - cron: "47 12 * * 6"     # Sa 13:47 MEZ: Quoten vor 15:30
    - cron: "47 15 * * 6"     # Sa 16:47 MEZ: Quoten vor 18:30
    - cron: "47 12 * * 0"     # So 13:47 MEZ: Quoten vor den Sonntagsspielen
  workflow_dispatch:
    inputs:
      saison:
        description: "Startjahr der Saison (leer = automatisch, z. B. 2026 = Saison 2026/27)"
        default: ""
        required: false
      von:
        description: "Erstes Startjahr, das geladen wird (leer = nur die Vorsaison; für den Verlauf z. B. 2019)"
        default: ""
        required: false

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig (sonst kollidieren die Commits)
concurrency:
  group: daten-abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    env:
      SAISON: ${{ github.event.inputs.saison }}
      VON: ${{ github.event.inputs.von }}
    steps:
      - name: Saison bestimmen
        run: |
          if [ -z "$SAISON" ]; then
            J=$(date -u +%Y); M=$(date -u +%-m)
            if [ "$M" -ge 7 ]; then SAISON=$J; else SAISON=$((J - 1)); fi
          fi
          echo "SAISON=$SAISON" >> "$GITHUB_ENV"
          echo "Saison: $SAISON"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Daten abrufen
        run: |
          VON=${VON:-$((SAISON - 1))}
          python -m pipeline.run abrufen --von "$VON" --bis "$SAISON"
      - name: Datenpaket für den nächsten Spieltag bauen
        run: python -m pipeline.run paket --saison "$SAISON" --spieltag auto
      - name: Quoten eintragen (falls ODDS_API_KEY gesetzt)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.run quoten --saison "$SAISON" --spieltag auto
      - name: Grafiken erzeugen
        run: |
          python -m grafik.run spieltag
          python -m grafik.run staerke --saison "$SAISON"
      - name: Nachbericht für den letzten beendeten Spieltag
        run: python -m pipeline.run nachbericht --saison "$SAISON" --spieltag letzter
      - name: Ergebnis einchecken
        run: |
          git config user.name "spieltagsformel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nur Ordner hinzufügen, die es gibt (Nachbericht-Entwürfe entstehen erst nach dem ersten beendeten Spieltag)
          for ordner in data/clean data/spieltage data/nachberichte entwuerfe grafik/ausgabe; do
            if [ -e "$ordner" ]; then git add "$ordner"; fi
          done
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "Daten aktualisiert"
          git push
