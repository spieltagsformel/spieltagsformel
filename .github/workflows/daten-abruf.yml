name: Daten abrufen

# Manuell startbar: Actions -> "Daten abrufen" -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      saison:
        description: "Startjahr der aktuellen Saison (2026 = Saison 2026/27)"
        default: "2026"
        required: true

permissions:
  contents: write

jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Daten abrufen (Vorsaison bis aktuelle Saison)
        run: |
          SAISON=${{ github.event.inputs.saison }}
          python -m pipeline.run abrufen --von $((SAISON - 1)) --bis $SAISON
      - name: Datenpaket für den nächsten Spieltag bauen
        run: python -m pipeline.run paket --saison ${{ github.event.inputs.saison }} --spieltag auto
      - name: Ergebnis einchecken
        run: |
          git config user.name "spieltagsformel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clean data/spieltage
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "Daten aktualisiert"
          git push
